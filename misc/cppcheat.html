<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cpp cheatsheet - Misc Note</title>
    <style>
      :root {
        --bg: #ffffff;
        --line: #b9e3c0;
        --text: #1e2720;
        --muted: #5e6a62;
        --accent: #2d6a4f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--bg);
        color: var(--text);
      }

      a {
        color: var(--accent);
      }

      .page {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 48px;
      }

      .masthead {
        padding: 6px 0 18px;
        border-bottom: 2px solid var(--accent);
      }

      .eyebrow {
        margin: 0 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--accent);
        font-size: 0.9rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.1;
      }

      .meta {
        color: var(--muted);
        display: block;
        margin-top: 10px;
      }

      .content {
        padding: 18px 0 20px;
        line-height: 1.75;
        border-bottom: 1px solid var(--line);
      }

      .content > * + * {
        margin-top: 1rem;
      }

      .footer {
        padding: 14px 0 0;
        color: var(--muted);
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 20px, 920px);
          padding-top: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <p class="eyebrow">Misc note</p>
        <h1>cpp cheatsheet</h1>
        <span class="meta"></span>
      </header>
      <section class="content">
        <h3>general</h3>
<p><code> ? : </code></p>
<h3>vector</h3>
<p><code> vector&lt;int&gt; test(n) </code></p>
<p><code> vector&lt;int&gt; test(n, a) </code></p>
<p><code> sort(a.begin(), a.end(), greater&lt;int&gt;()) </code> or <code> sort(a.begin(), a.end(), greater&lt;&gt;()) </code></p>
      </section>
      <footer class="footer">
        Back to <a href="/index.html">home</a>.
      </footer>
    </main>
  </body>
</html>
