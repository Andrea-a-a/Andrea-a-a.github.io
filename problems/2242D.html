<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2242D D. Two Digit Strings - Problem Note</title>
    <style>
      :root {
        --bg: #ffffff;
        --line: #9ec9ff;
        --text: #17253d;
        --muted: #5e6a82;
        --accent: #2457d6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--bg);
        color: var(--text);
      }

      a {
        color: var(--accent);
      }

      .page {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 48px;
      }

      .masthead {
        padding: 6px 0 18px;
        border-bottom: 2px solid var(--accent);
      }

      .eyebrow {
        margin: 0 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--accent);
        font-size: 0.9rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.1;
      }

      .meta {
        color: var(--muted);
        display: block;
        margin-top: 10px;
      }

      .content {
        padding: 18px 0 20px;
        line-height: 1.75;
        border-bottom: 1px solid var(--line);
      }

      .content > * + * {
        margin-top: 1rem;
      }

      .footer {
        padding: 14px 0 0;
        color: var(--muted);
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 20px, 920px);
          padding-top: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <p class="eyebrow">Problem note</p>
        <h1>2242D D. Two Digit Strings</h1>
        <span class="meta">Educational Codeforces Round 192 (Rated for Div. 2)</span>
      </header>
      <section class="content">
        <p><a href="https://codeforces.com/contest/2242/problem/D">传送门</a></p>
<p>由于不存在除法，对于合并的操作可以考虑模10意义下的前缀和，由于前缀和和原字符串是一一对应的，则问题转化为对两个字符串分别求出模10意义下的前缀和字符串，然后求两个前缀和数组的最大公共子序列（lcs），lcs长度即为所求；但注意到如果两个字符串的总和不相等的话就无论如何也无法成立，此时输出-1。</p>
      </section>
      <footer class="footer">
        Back to <a href="/index.html">home</a>.
      </footer>
    </main>
  </body>
</html>
